<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="860" viewBox="0 0 1640 860" role="img" aria-labelledby="title desc">
<title id="title">FreightWatch | Shipping Cost Anomaly Assistant</title>
<desc id="desc">Four-stage architecture diagram: input data, data pipeline and anomaly detection, context retrieval and evidence validation, outputs and audit.</desc>
<defs><style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#203b5d}.main{font-size:37px;font-weight:700;letter-spacing:-.7px}.st{font-size:20px;font-weight:700;fill:#fff}.h{font-size:16px;font-weight:700}.b{font-size:14px}.s{font-size:13px}.muted{fill:#516b89}.panel{fill:#fff;stroke:#8aa3bf;stroke-width:1.4}.head{fill:#203f63}.item{fill:#f0f5fb;stroke:#e0e9f3}.line,.ico{fill:none;stroke:#294b70;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.num{fill:#6c99d0}.nt{fill:#fff;font-size:15px;font-weight:700;text-anchor:middle}
</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#294b70" stroke-width="1.5"/></marker></defs>
<rect width="1640" height="860" fill="#fff"/><text x="820" y="64" class="main" text-anchor="middle">FreightWatch | Shipping Cost Anomaly Assistant</text><path d="M56 91H1584" stroke="#e4eaf1" stroke-width="1.5"/>
<!-- inputs -->
<g id="inputs"><rect x="24" y="128" width="292" height="654" rx="10" class="panel"/><path d="M34 128H306Q316 128 316 138V200H24V138Q24 128 34 128Z" class="head"/><text x="48" y="172" class="st">1. INPUT DATA</text>
<rect x="42" y="226" width="256" height="142" rx="8" class="item"/><g class="ico" transform="translate(62 254)"><path d="M0 0H28L42 14V60H0Z M28 0V14H42 M8 27H32M8 37H32M8 47H26"/></g><text x="118" y="275" class="h">Shipment records</text><text x="118" y="302" class="b muted">shipment_records.csv</text><text x="118" y="328" class="s muted">Costs, quantities, routes,</text><text x="118" y="347" class="s muted">distances and dates</text>
<rect x="42" y="389" width="256" height="142" rx="8" class="item"/><g class="ico" transform="translate(62 417)"><path d="M0 0H28L42 14V60H0Z M28 0V14H42 M8 27H32M8 37H32M8 47H26"/></g><text x="118" y="438" class="h">Context notes</text><text x="118" y="465" class="b muted">context_notes.csv</text><text x="118" y="491" class="s muted">Events, route scope, dates</text><text x="118" y="510" class="s muted">and reported impact</text><text x="48" y="733" class="s muted">Inputs are loaded from local CSV files.</text></g>
<!-- pipeline -->
<g id="pipeline"><rect x="350" y="128" width="470" height="654" rx="10" class="panel"/><path d="M360 128H810Q820 128 820 138V200H350V138Q350 128 360 128Z" class="head"/><text x="374" y="164" class="st">2. DATA PIPELINE &amp;</text><text x="374" y="188" class="st">ANOMALY DETECTION</text>
<g><rect x="370" y="218" width="430" height="88" rx="8" class="item"/><circle cx="399" cy="247" r="16" class="num"/><text x="399" y="252" class="nt">1</text><text x="427" y="245" class="h">Data ingestion and validation</text><text x="427" y="269" class="b">Load records; validate fields and dates.</text><text x="427" y="289" class="b muted">Handle invalid or duplicate records.</text></g>
<g><rect x="370" y="318" width="430" height="88" rx="8" class="item"/><circle cx="399" cy="347" r="16" class="num"/><text x="399" y="352" class="nt">2</text><text x="427" y="345" class="h">Group by route and week</text><text x="427" y="369" class="b">Origin, destination and route type.</text><text x="427" y="389" class="b muted">Monday–Sunday buckets (week_of).</text></g>
<g><rect x="370" y="418" width="430" height="88" rx="8" class="item"/><circle cx="399" cy="447" r="16" class="num"/><text x="399" y="452" class="nt">3</text><text x="427" y="445" class="h">Calculate weighted cost per tonne-km</text><text x="427" y="470" class="b">Total freight cost ÷ (total quantity × distance).</text><text x="427" y="489" class="s muted">Aggregate totals before calculating the ratio.</text></g>
<g><rect x="370" y="518" width="430" height="112" rx="8" class="item"/><circle cx="399" cy="547" r="16" class="num"/><text x="399" y="552" class="nt">4</text><text x="427" y="545" class="h">Compare against baselines</text><text x="427" y="569" class="b">• Trailing 8 observed weeks for the same route</text><text x="427" y="590" class="b">• Same-week peers of the same route type</text><text x="427" y="611" class="s muted">Exclude current week / route as applicable.</text></g>
<g><rect x="370" y="642" width="430" height="104" rx="8" class="item"/><circle cx="399" cy="671" r="16" class="num"/><text x="399" y="676" class="nt">5</text><text x="427" y="669" class="h">Detect unusual deviations</text><text x="427" y="693" class="b">Apply the configured thresholds and rules.</text><text x="427" y="715" class="b muted">Produce candidate anomalies for review.</text></g></g>
<!-- context -->
<g id="context"><rect x="854" y="128" width="420" height="654" rx="10" class="panel"/><path d="M864 128H1264Q1274 128 1274 138V200H854V138Q854 128 864 128Z" class="head"/><text x="878" y="164" class="st">3. CONTEXT RETRIEVAL &amp;</text><text x="878" y="188" class="st">EVIDENCE VALIDATION</text>
<rect x="874" y="218" width="380" height="136" rx="8" class="item"/><g class="ico" transform="translate(896 246)"><circle cx="15" cy="15" r="12"/><path d="M24 24L36 36"/></g><text x="946" y="249" class="h">Semantic retrieval</text><text x="946" y="274" class="b">Rank relevant context notes</text><text x="946" y="295" class="b">using local text similarity.</text><text x="896" y="328" class="s muted">Retrieval suggests candidates; it does not prove cause.</text><path d="M1064 354V375" class="line" marker-end="url(#arrow)"/>
<rect x="874" y="384" width="380" height="146" rx="8" class="item"/><g class="ico" transform="translate(896 409)"><path d="M20 0L38 7V22C38 35 29 43 20 48C11 43 2 35 2 22V7Z M11 23L17 29L29 16"/></g><text x="946" y="414" class="h">Evidence validation</text><text x="946" y="440" class="b">Check corridor and date window,</text><text x="946" y="461" class="b">plus stated cost impact and relevance.</text><text x="896" y="498" class="s muted">Only supported evidence can justify a verdict.</text><path d="M1064 530V551" class="line" marker-end="url(#arrow)"/>
<rect x="874" y="560" width="380" height="120" rx="8" class="item"/><g class="ico" transform="translate(898 585)"><path d="M0 0H28L42 14V54H0Z M28 0V14H42 M8 27H32M8 37H32M8 47H26"/></g><text x="954" y="590" class="h">Explanation engine</text><text x="954" y="616" class="b">Combine computed variances and</text><text x="954" y="637" class="b">validated evidence into a concise reason.</text><text x="894" y="707" class="s muted">Batch verdicts are deterministic; Groq is optional for Q&amp;A.</text></g>
<!-- outputs -->
<g id="outputs"><rect x="1308" y="128" width="308" height="654" rx="10" class="panel"/><path d="M1318 128H1606Q1616 128 1616 138V200H1308V138Q1308 128 1318 128Z" class="head"/><text x="1332" y="172" class="st">4. OUTPUTS &amp; AUDIT</text>
<rect x="1328" y="218" width="268" height="122" rx="8" class="item"/><g class="ico" transform="translate(1347 245)"><path d="M0 0H27L41 14V57H0Z M27 0V14H41 M8 27H32M8 37H32M8 47H25"/></g><text x="1400" y="248" class="h">output.csv</text><text x="1400" y="274" class="b">Verdict, matched note ID</text><text x="1400" y="295" class="b">and plain-English reason.</text><text x="1400" y="316" class="s muted">Contract-compliant schema</text>
<rect x="1328" y="354" width="268" height="106" rx="8" class="item"/><g class="ico" transform="translate(1348 380)"><rect x="0" y="0" width="40" height="42" rx="4"/><path d="M9 32V23M20 32V11M31 32V17"/></g><text x="1400" y="383" class="h">weekly_metrics_debug.csv</text><text x="1400" y="410" class="b">Weekly calculations</text><text x="1400" y="432" class="b muted">and baseline comparisons</text>
<rect x="1328" y="474" width="268" height="106" rx="8" class="item"/><g class="ico" transform="translate(1347 500)"><path d="M0 0H27L41 14V57H0Z M27 0V14H41 M8 27H32M8 37H32M8 47H25"/></g><text x="1400" y="503" class="h">token_cost_log.json</text><text x="1400" y="530" class="b">Optional LLM usage</text><text x="1400" y="552" class="b muted">and cost tracking</text>
<rect x="1328" y="594" width="268" height="152" rx="8" fill="#edf3f8" stroke="#d7e2ed"/><g class="ico" transform="translate(1348 617)"><path d="M17 0L34 7V22C34 34 26 41 17 46C8 41 0 34 0 22V7Z M9 22L15 28L25 16"/></g><text x="1394" y="624" class="h">Quality checks</text><text x="1348" y="681" class="b">• Stable batch output</text><text x="1348" y="704" class="b">• Evidence-grounded verdicts</text><text x="1348" y="727" class="b">• Pytest and reproducibility</text></g>
<!-- stage connectors -->
<path d="M316 430H340" class="line" marker-end="url(#arrow)"/><path d="M820 430H844" class="line" marker-end="url(#arrow)"/><path d="M1274 430H1298" class="line" marker-end="url(#arrow)"/><text x="820" y="826" class="s muted" text-anchor="middle">Deterministic analytics first · Evidence-grounded explanations · Optional LLM for conversational queries</text>
</svg>
