<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="600" y="45" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">FreightWatch | Shipping Cost Anomaly Assistant</text>
  <text x="600" y="70" font-size="14" fill="#64748b" text-anchor="middle">Production-Grade Deterministic RAG Pipeline & Compliance Engine</text>

  <!-- Column 1: Input Data -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="250" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="250" height="60" rx="12" fill="url(#headerGrad)" />
    <text x="25" y="35" font-size="16" font-weight="bold" fill="#ffffff">1. INPUT DATA</text>
    
    <!-- Card 1 -->
    <g transform="translate(15, 80)">
      <rect width="220" height="190" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="20" y="35" font-size="14" font-weight="bold" fill="#1e293b">Shipment Records</text>
      <text x="20" y="55" font-size="12" fill="#64748b">shipment_records.csv</text>
      <line x1="20" y1="70" x2="200" y2="70" stroke="#e2e8f0" />
      <text x="20" y="95" font-size="11" fill="#475569">• Transaction history</text>
      <text x="20" y="115" font-size="11" fill="#475569">• Origin, destination, cost</text>
      <text x="20" y="135" font-size="11" fill="#475569">• Quantities & distances</text>
      <text x="20" y="155" font-size="11" fill="#475569">• Transporter metadata</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(15, 290)">
      <rect width="220" height="190" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="20" y="35" font-size="14" font-weight="bold" fill="#1e293b">Context Notes</text>
      <text x="20" y="55" font-size="12" fill="#64748b">context_notes.csv</text>
      <line x1="20" y1="70" x2="200" y2="70" stroke="#e2e8f0" />
      <text x="20" y="95" font-size="11" fill="#475569">• Fuel price changes</text>
      <text x="20" y="115" font-size="11" fill="#475569">• Toll updates & weather</text>
      <text x="20" y="135" font-size="11" fill="#475569">• Festival surcharges</text>
      <text x="20" y="155" font-size="11" fill="#475569">• Operational notes</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 300 360 L 330 360" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- Column 2: Data Pipeline & Anomaly Detection -->
  <g transform="translate(340, 100)" filter="url(#shadow)">
    <rect width="260" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="260" height="60" rx="12" fill="url(#headerGrad)" />
    <text x="20" y="35" font-size="15" font-weight="bold" fill="#ffffff">2. PIPELINE & DETECTION</text>

    <!-- Steps in Col 2 -->
    <g transform="translate(15, 75)">
      <rect width="230" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">1. Data Ingestion & Cleaning</text>
      <text x="15" y="45" font-size="11" fill="#64748b">Validates schema & formats dates</text>
      <text x="15" y="60" font-size="11" fill="#64748b">Monday-Sunday weekly buckets</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="230" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">2. Cost Metric Calculation</text>
      <text x="15" y="45" font-size="11" fill="#64748b">Cost per tonne-km formula:</text>
      <text x="15" y="60" font-size="11" fill="#0f172a" font-family="monospace">Total Cost / (Qty × Dist)</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="230" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">3. Baseline Comparisons</text>
      <text x="15" y="45" font-size="11" fill="#64748b">• Own History: Trailing 8 weeks</text>
      <text x="15" y="65" font-size="11" fill="#64748b">• Peer Routes: Same route type</text>
      <text x="15" y="85" font-size="10" fill="#94a3b8">Strictly prevents look-ahead bias</text>
    </g>

    <g transform="translate(15, 365)">
      <rect width="230" height="135" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">4. Statistical Anomaly Trigger</text>
      <text x="15" y="45" font-size="11" fill="#64748b">Evaluates cost surges against</text>
      <text x="15" y="60" font-size="11" fill="#64748b">statistical thresholds.</text>
      <rect x="15" y="75" width="200" height="45" rx="4" fill="#fee2e2" stroke="#fca5a5" />
      <text x="25" y="95" font-size="11" font-weight="bold" fill="#991b1b">Flags Outlier Route-Weeks</text>
      <text x="25" y="110" font-size="10" fill="#b91c1c">Generates exception list</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 610 360 L 640 360" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- Column 3: Context Retrieval & Evidence Validation -->
  <g transform="translate(650, 100)" filter="url(#shadow)">
    <rect width="260" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="260" height="60" rx="12" fill="url(#headerGrad)" />
    <text x="15" y="35" font-size="15" font-weight="bold" fill="#ffffff">3. RAG & EVIDENCE GATE</text>

    <g transform="translate(15, 75)">
      <rect width="230" height="105" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">1. Semantic RAG Retrieval</text>
      <text x="15" y="45" font-size="11" fill="#64748b">TF-IDF / vector text similarity</text>
      <text x="15" y="65" font-size="11" fill="#64748b">matches context notes to anomalies</text>
      <text x="15" y="85" font-size="10" fill="#64748b">without external API latency.</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="230" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">2. Evidence Validation Gate</text>
      <text x="15" y="45" font-size="11" fill="#64748b">Verifies route corridor and</text>
      <text x="15" y="60" font-size="11" fill="#64748b">temporal window alignment.</text>
      <rect x="15" y="75" width="200" height="30" rx="4" fill="#dcfce7" stroke="#86efac" />
      <text x="25" y="95" font-size="11" font-weight="bold" fill="#166534">No Note = Unexplained ("Yes")</text>
    </g>

    <g transform="translate(15, 320)">
      <rect width="230" height="180" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="25" font-size="12" font-weight="bold" fill="#1e293b">3. Explanation & Q&A Layer</text>
      <text x="15" y="45" font-size="11" fill="#64748b">• Generates concise reasons</text>
      <text x="15" y="65" font-size="11" fill="#64748b">• Deterministic batch output</text>
      <text x="15" y="85" font-size="11" fill="#64748b">• Optional Groq LLM phrasing</text>
      <line x1="15" y1="100" x2="215" y2="100" stroke="#e2e8f0" />
      <text x="15" y="120" font-size="10" font-weight="bold" fill="#0f172a">Guardrail Guarantee:</text>
      <text x="15" y="138" font-size="10" fill="#475569">100% Repro Across 3 Runs</text>
      <text x="15" y="155" font-size="10" fill="#475569">Zero Hallucination Policy</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 920 360 L 950 360" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- Column 4: Outputs & Audit -->
  <g transform="translate(960, 100)" filter="url(#shadow)">
    <rect width="200" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="200" height="60" rx="12" fill="url(#headerGrad)" />
    <text x="15" y="35" font-size="15" font-weight="bold" fill="#ffffff">4. OUTPUTS & AUDIT</text>

    <g transform="translate(12, 75)">
      <rect width="176" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="25" font-size="12" font-weight="bold" fill="#1e293b">Final Report</text>
      <text x="12" y="43" font-size="11" fill="#64748b">output.csv</text>
      <text x="12" y="65" font-size="10" fill="#475569">Exact contract schema:</text>
      <text x="12" y="82" font-size="10" font-family="monospace" fill="#0f172a">route, week_of,</text>
      <text x="12" y="96" font-size="10" font-family="monospace" fill="#0f172a">flagged, reason</text>
    </g>

    <g transform="translate(12, 195)">
      <rect width="176" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="25" font-size="12" font-weight="bold" fill="#1e293b">Debug Metrics</text>
      <text x="12" y="43" font-size="11" fill="#64748b">weekly_metrics_debug.csv</text>
      <text x="12" y="65" font-size="10" fill="#475569">Full historical calculations</text>
    </g>

    <g transform="translate(12, 290)">
      <rect width="176" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="25" font-size="12" font-weight="bold" fill="#1e293b">Audit Log</text>
      <text x="12" y="43" font-size="11" fill="#64748b">token_cost_log.json</text>
      <text x="12" y="65" font-size="10" fill="#475569">Token & cost tracking</text>
    </g>

    <g transform="translate(12, 385)">
      <rect width="176" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="12" y="22" font-size="11" font-weight="bold" fill="#166534">Validation Suite</text>
      <text x="12" y="40" font-size="10" fill="#15803d">✓ Pytest Unit Tests</text>
      <text x="12" y="58" font-size="10" fill="#15803d">✓ Reproducibility Check</text>
      <text x="12" y="75" font-size="10" fill="#15803d">✓ 3-Run Consistency</text>
      <text x="12" y="92" font-size="10" fill="#15803d">✓ Strict Output Schema</text>
    </g>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>